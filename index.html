<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chithi Ghor - Multi-VC Activator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 25px; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #94a3b8; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background-color: #334155; color: white; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { height: 120px; resize: none; }
        button { width: 100%; padding: 14px; margin-top: 25px; border: none; border-radius: 6px; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        .status { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; text-align: center; font-weight: bold; font-size: 14px; }
        .success { background-color: #16a34a; color: white; }
        .error { background-color: #dc2626; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Chithi Ghor VC Activator</h2>
        <form id="botForm">
            <label>ডিসকর্ড ইউজার টোকেন (একাধিক হলে কমা ',' দিয়ে আলাদা করুন):</label>
            <textarea id="tokens" placeholder="Token1, Token2, Token3..." required></textarea>

            <label>ভয়েস চ্যানেল (VC) আইডি:</label>
            <input type="text" id="vcId" placeholder="1126797582715326524" required>

            <button type="submit">আইডিগুলো ভিসি-তে যুক্ত করুন</button>
        </form>
        <div id="statusBox" class="status"></div>
    </div>

    <script>
        document.getElementById('botForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'none';

            // টোকেনগুলোকে কমা দিয়ে আলাদা করে অ্যারে বানানো হচ্ছে
            const tokens = document.getElementById('tokens').value.split(',').map(t => t.trim()).filter(t => t);
            const vcId = document.getElementById('vcId').value.trim();

            try {
                const response = await fetch('/api/start-bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tokens, vcId })
                });
                const data = await response.json();
                
                if(response.ok) {
                    statusBox.className = 'status success';
                    statusBox.innerText = data.message;
                } else {
                    statusBox.className = 'status error';
                    statusBox.innerText = data.error;
                }
            } catch (err) {
                statusBox.className = 'status error';
                statusBox.innerText = 'সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না।';
            }
            statusBox.style.display = 'block';
        });
    </script>
</body>
</html>
